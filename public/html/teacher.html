<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal - Seeds Palestine School</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --pal-black: #111111;
            --pal-white: #ffffff;
            --pal-green: #007a3d;
            --pal-red: #ce1126;
            --text: #0f172a;
            --muted: #64748b;
            --card: rgba(255, 255, 255, 0.94);
            --border: rgba(15, 23, 42, 0.12);
            --shadow: 0 18px 45px rgba(2, 6, 23, 0.18);
        }

        body {
            background:
                radial-gradient(900px 500px at 15% 10%, rgba(0, 122, 61, 0.14), transparent 60%),
                radial-gradient(900px 600px at 85% 0%, rgba(206, 17, 38, 0.14), transparent 55%),
                linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            padding: 14px;
        }

        .header {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            color: var(--pal-white);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            margin: 0 0 12px 0;
            font-size: 20px;
            letter-spacing: 0.2px;
        }

        .teacher-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .teacher-section {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .section-title {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 14px;
            border-bottom: 2px solid rgba(0, 122, 61, 0.35);
            padding-bottom: 10px;
        }
        
        .attendance-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        
        .student-card {
            background: rgba(248, 250, 252, 0.95);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(15, 23, 42, 0.10);
            transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
        }
        
        .student-card:hover {
            border-color: rgba(0, 122, 61, 0.35);
            box-shadow: 0 10px 28px rgba(2, 6, 23, 0.12);
        }
        
        .student-name {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            font-size: 15px;
        }

        .student-id {
            color: var(--muted);
            font-size: 13px;
        }
        
        .attendance-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .btn-present {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            flex: 1;
            font-size: 15px;
            touch-action: manipulation;
        }
        
        .btn-absent {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            flex: 1;
            font-size: 15px;
            touch-action: manipulation;
        }
        
        .btn-present:hover, .btn-absent:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .btn-present:active, .btn-absent:active {
            transform: translateY(0);
        }
        
        .bus-route-card {
            background: rgba(248, 250, 252, 0.96);
            color: var(--text);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid rgba(15, 23, 42, 0.10);
            box-shadow: 0 10px 28px rgba(2, 6, 23, 0.10);
        }

        .bus-route-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .route-meta {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }
        
        .route-name {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 0;
        }
        
        .route-students {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .student-badge {
            background: rgba(0, 122, 61, 0.10);
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            color: rgba(0, 122, 61, 0.95);
            font-weight: 700;
        }
        
        .teacher-info {
            background: #e8f4fd;
            border-left: 4px solid #2196F3;
            padding: 12px;
            margin-bottom: 0;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .date-selector {
            background: white;
            border: 1px solid rgba(15, 23, 42, 0.18);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 0;
            font-size: 15px;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .logout-btn {
            position: static;
            background: rgba(255,255,255,0.20);
            color: white;
            border: 1px solid rgba(255,255,255,0.60);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .filter-select {
            background: white;
            border: 1px solid rgba(15, 23, 42, 0.18);
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
        }

        .teacher-nav {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .nav-btn {
            flex: 1;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.10);
            color: rgba(255,255,255,0.92);
            padding: 12px 14px;
            border-radius: 14px;
            font-weight: 800;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
            touch-action: manipulation;
        }

        .nav-btn:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.32);
        }

        .nav-btn.active {
            background: linear-gradient(90deg, rgba(0, 122, 61, 0.92), rgba(0, 162, 85, 0.92));
            border-color: rgba(255,255,255,0.35);
            color: white;
        }

        .section-hidden {
            display: none;
        }

        #bus-routes-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 720px) {
            .container { padding: 18px; }
            .header h1 { font-size: 22px; }
            .teacher-section { padding: 18px; }
            .filters { grid-template-columns: 220px 1fr; align-items: center; }
            .attendance-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
            #bus-routes-container { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (min-width: 1020px) {
            .attendance-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            #bus-routes-container { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>�‍🏫 Teacher Portal - Attendance Assistant</h1>
            <div class="teacher-info">
                <span>Teacher: <span id="teacher-name">Loading...</span></span>
                <span>Class: <span id="teacher-class">All Classes</span></span>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>

            <div class="teacher-nav">
                <button class="nav-btn active" id="nav-attendance" type="button">📝 Attendance</button>
                <button class="nav-btn" id="nav-routes" type="button">🚌 Routes</button>
            </div>
        </div>

        <div class="success-message" id="success-message">
            Attendance marked successfully!
        </div>

        <!-- Attendance Section -->
        <div class="teacher-section" id="attendance-section">
            <h2 class="section-title">📝 Take Attendance</h2>
            
            <div class="filters">
                <input type="date" id="attendance-date" class="date-selector">
                <select id="class-filter" class="filter-select">
                    <option value="">Select Class</option>
                    <option value="KG1">KG1</option>
                    <option value="KG2">KG2</option>
                    <option value="1">Grade 1</option>
                    <option value="2">Grade 2</option>
                    <option value="3">Grade 3</option>
                    <option value="4 Boys">Grade 4 Boys</option>
                    <option value="4 Girls">Grade 4 Girls</option>
                    <option value="5">Grade 5</option>
                    <option value="6 Boys">Grade 6 Boys</option>
                    <option value="6 Girls">Grade 6 Girls</option>
                    <option value="7 Boys">Grade 7 Boys</option>
                    <option value="7 Girls">Grade 7 Girls</option>
                    <option value="8 Boys">Grade 8 Boys</option>
                    <option value="8 Girls">Grade 8 Girls</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                </select>
            </div>

            <div class="attendance-grid" id="attendance-grid">
                <!-- Students will be loaded here -->
            </div>
        </div>

        <!-- Bus Routes Section -->
        <div class="teacher-section section-hidden" id="routes-section">
            <h2 class="section-title">🚌 Bus Routes - Students on Buses</h2>

            <div class="filters" style="margin-bottom: 12px;">
                <select id="route-filter" class="filter-select">
                    <option value="">All Routes</option>
                </select>
            </div>
            
            <div id="bus-routes-container">
                <!-- Bus routes will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Teacher data (in real app, this would come from server)
        const currentTeacher = {
            name: "Teacher Name",
            class: "Grade 5",
            permissions: ["attendance", "bus_view"]
        };

        // Initialize teacher portal
        document.addEventListener('DOMContentLoaded', () => {
            loadTeacherInfo();
            loadBusRoutes();
            
            // Set today's date
            document.getElementById('attendance-date').value = new Date().toISOString().split('T')[0];

            const savedClass = localStorage.getItem('teacher_selected_class') || '';
            const classFilterEl = document.getElementById('class-filter');
            if (classFilterEl) {
                classFilterEl.value = savedClass;
            }
            updateTeacherClassDisplay(savedClass);
            loadAttendanceStudents();
            
            // Add event listeners
            document.getElementById('attendance-date').addEventListener('change', loadAttendanceStudents);
            document.getElementById('class-filter').addEventListener('change', () => {
                const selected = document.getElementById('class-filter').value;
                localStorage.setItem('teacher_selected_class', selected);
                updateTeacherClassDisplay(selected);
                loadAttendanceStudents();
            });

            const navAttendance = document.getElementById('nav-attendance');
            const navRoutes = document.getElementById('nav-routes');
            const attendanceSection = document.getElementById('attendance-section');
            const routesSection = document.getElementById('routes-section');

            const setView = (view) => {
                if (!attendanceSection || !routesSection || !navAttendance || !navRoutes) return;
                const showAttendance = view === 'attendance';
                attendanceSection.classList.toggle('section-hidden', !showAttendance);
                routesSection.classList.toggle('section-hidden', showAttendance);
                navAttendance.classList.toggle('active', showAttendance);
                navRoutes.classList.toggle('active', !showAttendance);
                try {
                    localStorage.setItem('teacher_selected_view', view);
                } catch (_) {
                    // ignore
                }
            };

            navAttendance.addEventListener('click', () => setView('attendance'));
            navRoutes.addEventListener('click', () => {
                setView('routes');
                loadBusRoutes();
            });

            const savedView = localStorage.getItem('teacher_selected_view') || 'attendance';
            setView(savedView === 'routes' ? 'routes' : 'attendance');

            const routeFilter = document.getElementById('route-filter');
            const savedRoute = localStorage.getItem('teacher_selected_route') || '';
            if (routeFilter) {
                routeFilter.value = savedRoute;
                routeFilter.addEventListener('change', () => {
                    const next = routeFilter.value;
                    localStorage.setItem('teacher_selected_route', next);
                    loadBusRoutes();
                });
            }
        });

        function loadTeacherInfo() {
            document.getElementById('teacher-name').textContent = currentTeacher.name;
            document.getElementById('teacher-class').textContent = currentTeacher.class;
        }

        function updateTeacherClassDisplay(selectedClass) {
            const el = document.getElementById('teacher-class');
            if (!el) return;
            el.textContent = selectedClass ? selectedClass : 'Select Class';
        }

        async function loadAttendanceStudents() {
            const date = document.getElementById('attendance-date').value;
            const classFilter = document.getElementById('class-filter').value;
            
            try {
                const grid = document.getElementById('attendance-grid');
                if (!classFilter) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666;">Please select a class first</div>';
                    return;
                }

                const response = await fetch('/api/data');
                const data = await response.json();

                let students = data.students || [];
                let attendance = data.attendance || [];
                if (!Array.isArray(students)) students = [];
                if (!Array.isArray(attendance)) attendance = [];
                
                // Filter by class
                students = students.filter(s => s.class === classFilter);

                grid.innerHTML = '';

                if (students.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666;">No students found for this class</div>';
                    return;
                }

                students.forEach(student => {
                    const existing = attendance.find(a => String(a.studentId) === String(student.id) && a.date === date);
                    const currentStatus = existing ? existing.status : '';

                    const card = document.createElement('div');
                    card.className = 'student-card';
                    card.innerHTML = `
                        <div class="student-name">${student.name}</div>
                        <div class="student-id">ID: ${student.id} | Class: ${student.class}</div>
                        <div style="margin-top: 6px; color: #666; font-size: 13px;">Status: ${currentStatus || 'unmarked'}</div>
                        <div class="attendance-buttons">
                            <button class="btn-present" onclick="markAttendance(${student.id}, 'present')">
                                ✅ Present
                            </button>
                            <button class="btn-absent" onclick="markAttendance(${student.id}, 'absent')">
                                ❌ Absent
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading students:', error);
                document.getElementById('attendance-grid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #dc3545;">Error loading student data</div>';
            }
        }

        async function loadBusRoutes() {
            try {
                // Load real bus data from admin server
                const response = await fetch('/api/data');
                const data = await response.json();
                
                const busSubscriptions = data.busSubscriptions || [];
                const students = data.students || [];
                
                // Group students by route
                const routes = {};
                busSubscriptions.forEach(subscription => {
                    const student = students.find(s => s.id === subscription.studentId);
                    if (student) {
                        if (!routes[subscription.route]) {
                            routes[subscription.route] = [];
                        }
                        routes[subscription.route].push({
                            name: student.name,
                            class: student.class
                        });
                    }
                });

                const routeFilter = document.getElementById('route-filter');
                const allRouteNames = Object.keys(routes).sort((a, b) => String(a).localeCompare(String(b)));
                if (routeFilter) {
                    const prev = routeFilter.value || '';
                    routeFilter.innerHTML = '<option value="">All Routes</option>';
                    allRouteNames.forEach((r) => {
                        const opt = document.createElement('option');
                        opt.value = r;
                        opt.textContent = r;
                        routeFilter.appendChild(opt);
                    });
                    const savedRoute = localStorage.getItem('teacher_selected_route') || '';
                    const nextVal = allRouteNames.includes(savedRoute) ? savedRoute : '';
                    routeFilter.value = nextVal;
                    if (prev && prev !== nextVal) {
                        localStorage.setItem('teacher_selected_route', nextVal);
                    }
                }

                const selectedRoute = (routeFilter && routeFilter.value) ? routeFilter.value : '';
                const routeEntries = selectedRoute
                    ? Object.entries(routes).filter(([name]) => String(name) === String(selectedRoute))
                    : Object.entries(routes);

                const container = document.getElementById('bus-routes-container');
                container.innerHTML = '';

                if (Object.keys(routes).length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">No bus routes found</div>';
                    return;
                }

                if (routeEntries.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">No students found for this route</div>';
                    return;
                }

                routeEntries.forEach(([routeName, routeStudents]) => {
                    const routeCard = document.createElement('div');
                    routeCard.className = 'bus-route-card';
                    routeCard.innerHTML = `
                        <div class="bus-route-head">
                            <div class="route-name">🚌 ${routeName}</div>
                            <div class="route-meta">${routeStudents.length} students</div>
                        </div>
                        <div class="route-students">
                            ${routeStudents.map(student => 
                                `<span class="student-badge">${student?.name || ''}${student?.class ? ` (${student.class})` : ''}</span>`
                            ).join('')}
                        </div>
                    `;
                    container.appendChild(routeCard);
                });
            } catch (error) {
                console.error('Error loading bus routes:', error);
                document.getElementById('bus-routes-container').innerHTML = '<div style="text-align: center; padding: 40px; color: #dc3545;">Error loading bus data</div>';
            }
        }

        async function markAttendance(studentId, status) {
            const date = document.getElementById('attendance-date').value;
            
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                let attendance = data.attendance || [];
                if (!Array.isArray(attendance)) attendance = [];

                const existingIndex = attendance.findIndex(a =>
                    String(a.studentId) === String(studentId) && a.date === date
                );

                const nowIso = new Date().toISOString();
                const existingId = existingIndex >= 0 ? (attendance[existingIndex]?.id || Date.now().toString()) : Date.now().toString();
                const attendanceRecord = {
                    id: existingId,
                    studentId: String(studentId),
                    date: date,
                    status: status,
                    markedBy: currentTeacher.username,
                    markedAt: nowIso,
                    time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
                };

                if (existingIndex >= 0) {
                    attendance[existingIndex] = attendanceRecord;
                } else {
                    attendance.push(attendanceRecord);
                }

                await fetch('/api/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        type: 'attendance',
                        data: attendance
                    })
                });
                
                // Show success message
                const successMsg = document.getElementById('success-message');
                successMsg.style.display = 'block';
                successMsg.textContent = `Attendance marked successfully! Student ${studentId} marked as ${status}.`;
                
                // Hide message after 3 seconds
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 3000);
                
                // Refresh teacher UI status labels
                await loadAttendanceStudents();
                
                console.log('Attendance saved to server:', attendanceRecord);
                
            } catch (error) {
                console.error('Error marking attendance:', error);
                alert('Error marking attendance. Please try again.');
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
